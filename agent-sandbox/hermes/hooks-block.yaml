# Stamped into every profile config, not only the root one.
#
# The root config carried this block for seven runs and the gate never fired
# once. `require-green.log` was empty every time, which was read as "no card
# ever completed, so the hook never had a chance" — until run `long-a` completed
# a card, went through builder -> review -> complete, and the log was STILL
# absent. A kanban worker runs as `hermes -p <profile> ... chat`, and a profile
# config does not inherit the root `hooks` block; the profiles had no `hooks`
# key at all. Same trap as `disabled_toolsets`, which never reached a worker for
# exactly this reason.
hooks_auto_accept: true
hooks:
  pre_tool_call:
    - matcher: "^kanban_(complete|request_review)$"
      command: "/usr/local/bin/require-green.sh"
      timeout: 290
      fail_closed: true
