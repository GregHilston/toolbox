# Copy to ~/.config/needs-greg/config.toml on the host that runs the server.
owner = "owner"                 # GitHub user or org whose repos are scanned
login = "user@example.com"      # only this Tailscale-User-Login is served
port = 8765
label = "needs-greg"
# Where Claude sessions start: "local" runs hc or herdr on this host, anything else is an ssh target.
session_host = "local"
# Session backend: "hc" (Herdr desktop app) or "herdr" (the TUI).
sessions = "hc"
# Full paths for a launchd or ssh PATH that lacks them.
# herdr = "/opt/homebrew/bin/herdr"
# hc = "/opt/homebrew/bin/hc"
# gh = "/opt/homebrew/bin/gh"

# repo name = checkout path on session_host
[repos]
repo-a = "/home/user/repo-a"
repo-b = "/home/user/repo-b"
