<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Needs you</title>
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --fg: #1b1f24; --dim: #5d6672; --line: #d9dde3;
  --accent: #2457d6; --accent-fg: #fff; --ok: #1c7a3c; --warn: #9a5b00; --err: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111419; --card: #1a1f27; --fg: #e8ebef; --dim: #98a1ad; --line: #2c333d;
    --accent: #6c93f5; --accent-fg: #0c1220; --ok: #5cc07d; --warn: #e0a24a; --err: #f08a82;
  }
}
:root[data-theme="dark"] {
  --bg: #111419; --card: #1a1f27; --fg: #e8ebef; --dim: #98a1ad; --line: #2c333d;
  --accent: #6c93f5; --accent-fg: #0c1220; --ok: #5cc07d; --warn: #e0a24a; --err: #f08a82;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.45 system-ui, -apple-system, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.25rem; margin: 0 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--fg);
  border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; margin-bottom: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--dim); font-size: .875rem; }
.badge { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px;
  color: var(--fg); font-weight: 600; }
.meta a { color: var(--accent); text-decoration: none; }
.ask { font-size: 1.05rem; margin: 10px 0; overflow-wrap: anywhere; }
.warn { color: var(--warn); font-size: .85rem; margin: 0 0 8px; }
.imgs { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 12px; }
.imgs img { width: 100%; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; display: block; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
button.btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--fg);
  border-radius: 8px; padding: 10px 14px; min-height: 44px; cursor: pointer; }
button.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.btn[aria-pressed="true"] { outline: 2px solid var(--accent); }
button.btn:disabled { opacity: .5; cursor: default; }
textarea, select { width: 100%; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-top: 8px; }
.panel { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 4px; }
.status { margin-top: 8px; font-size: .9rem; }
.status.err { color: var(--err); } .status.ok { color: var(--ok); }
.empty { text-align: center; color: var(--dim); padding: 40px 0; }
#zoom { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; overflow: auto; z-index: 9; }
#zoom.open { display: block; }
#zoom img { max-width: none; width: 100%; min-width: 100%; display: block; }
@media (min-width: 900px) { #zoom img { width: auto; max-width: 100%; margin: 0 auto; } }
</style>
</head>
<body>
<main>
  <h1>Needs you</h1>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</main>
<div id="zoom"><img alt=""></div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const state = { asks: [], repos: [], filter: "All", open: {}, drafts: {} };

function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
  return null;
}

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null) n.append(kid);
  return n;
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

function imgSrc(a, p) {
  return `/api/image?repo=${encodeURIComponent(a.repo)}&path=${encodeURIComponent(p)}`;
}

const key = (a) => `${a.repo}#${a.number}`;
const draft = (a) => (state.drafts[key(a)] ||= { text: "", note: "", chosen: null, model: "sonnet" });

// a field that keeps its value in state across render()
function field(a, prop, attrs) {
  const t = el("textarea", attrs);
  t.value = draft(a)[prop];
  t.addEventListener("input", () => { draft(a)[prop] = t.value; });
  return t;
}

function zoom(src) {
  $("#zoom img").src = src;
  $("#zoom").classList.add("open");
}
$("#zoom").addEventListener("click", () => $("#zoom").classList.remove("open"));

function chips() {
  const counts = {};
  for (const a of state.asks) counts[a.repo] = (counts[a.repo] || 0) + 1;
  const names = ["All", ...state.repos.filter((r) => counts[r])];
  if (!names.includes(state.filter)) state.filter = "All";
  $("#chips").replaceChildren(...names.map((n) => el("button", {
    class: "chip", "aria-pressed": String(n === state.filter),
    onclick: () => { state.filter = n; store("filter", n); render(); },
  }, n === "All" ? `All ${state.asks.length}` : `${n} ${counts[n]}`)));
}

function answerControls(a, status) {
  const box = el("div");
  const send = async (kind, text, note) => {
    box.querySelectorAll("button").forEach((b) => (b.disabled = true));
    status.className = "status"; status.textContent = "Sending...";
    try {
      await api("/api/answer", { repo: a.repo, number: a.number, kind, text, note });
      state.asks = state.asks.filter((x) => x !== a);
      delete state.drafts[key(a)];
      render();
    } catch (e) {
      status.className = "status err"; status.textContent = e.message;
      box.querySelectorAll("button").forEach((b) => (b.disabled = false));
    }
  };
  if (a.type === "pick") {
    const d = draft(a);
    const note = field(a, "note", { rows: 2, placeholder: "Optional note" });
    const submit = el("button", { class: "btn primary", disabled: !d.chosen,
      onclick: () => send("pick", d.chosen, d.note) }, "Send");
    const btns = a.options.map((o) => el("button", { class: "btn", "aria-pressed": String(d.chosen === o.key),
      onclick: () => {
        d.chosen = o.key; submit.disabled = false;
        btns.forEach((b, i) => b.setAttribute("aria-pressed", String(a.options[i].key === d.chosen)));
      },
    }, `${o.key}: ${o.label}`));
    box.append(el("div", { class: "row" }, btns), note, el("div", { class: "row" }, submit));
  } else if (a.type === "text") {
    const t = field(a, "text", { rows: 3, placeholder: "Your answer" });
    box.append(t, el("div", { class: "row" },
      el("button", { class: "btn primary", onclick: () => t.value.trim() ? send("text", t.value) : null }, "Send")));
  } else {
    const t = field(a, "note", { rows: 2, placeholder: "Optional note" });
    box.append(t, el("div", { class: "row" },
      el("button", { class: "btn primary", onclick: () => send("done", "", t.value) }, "Done")));
  }
  return box;
}

function startPanel(a, status) {
  const model = el("select", {}, el("option", { value: "haiku" }, "Haiku"),
    el("option", { value: "sonnet" }, "Sonnet"), el("option", { value: "opus" }, "Opus"));
  model.value = draft(a).model;
  model.addEventListener("change", () => { draft(a).model = model.value; });
  const go = el("button", { class: "btn primary" }, "Start session");
  go.addEventListener("click", async () => {
    go.disabled = true; status.className = "status"; status.textContent = "Starting...";
    try {
      const r = await api("/api/start", { repo: a.repo, number: a.number, model: model.value });
      status.className = "status ok"; status.textContent = `Started tab ${r.tab} in ${r.workspace}.`;
      delete state.open[key(a)];
      setTimeout(render, 2500);
    } catch (e) {
      status.className = "status err"; status.textContent = e.message; go.disabled = false;
    }
  });
  return el("div", { class: "panel" }, el("p", {}, `Start Claude on #${a.number}?`), model,
    el("div", { class: "row" }, go,
      el("button", { class: "btn", onclick: () => { delete state.open[key(a)]; render(); } }, "Cancel")));
}

function card(a) {
  const status = el("div", { class: "status", "aria-live": "polite" });
  const c = el("div", { class: "card" },
    el("div", { class: "meta" }, el("span", { class: "badge" }, a.repo),
      el("a", { href: a.url, target: "_blank", rel: "noopener" }, `#${a.number}`),
      el("span", {}, a.age), a.minutes ? el("span", {}, `${a.minutes} min`) : null),
    el("p", { class: "ask" }, a.ask),
    a.warning ? el("p", { class: "warn" }, `Ask block ignored: ${a.warning}`) : null,
    a.images.length ? el("div", { class: "imgs" }, a.images.map((p) => {
      const src = imgSrc(a, p);
      return el("img", { src, loading: "lazy", alt: p, onclick: () => zoom(src) });
    })) : null,
    answerControls(a, status),
    el("div", { class: "row" }, state.open[key(a)] ? null : el("button", { class: "btn",
      onclick: () => { state.open[key(a)] = true; render(); } }, "Start now")),
    state.open[key(a)] ? startPanel(a, status) : null,
    status);
  return c;
}

function render() {
  chips();
  const shown = state.asks.filter((a) => state.filter === "All" || a.repo === state.filter);
  $("#list").replaceChildren(...(shown.length ? shown.map(card)
    : [el("p", { class: "empty" }, "Nothing is waiting on you.")]));
}

async function load() {
  try {
    const d = await api("/api/asks");
    state.asks = d.asks; state.repos = d.repos;
  } catch (e) {
    $("#list").replaceChildren(el("p", { class: "status err" }, e.message));
    return;
  }
  render();
}

state.filter = store("filter") || "All";
load();
</script>
</body>
</html>
