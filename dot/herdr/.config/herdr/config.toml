onboarding = false

[keys]
prefix = ["alt+a", "ctrl+backslash"]
# Direct keys live on ctrl+alt: AeroSpace owns alt
# and alt+shift, zellij owns ctrl.
next_workspace = "ctrl+alt+j"
previous_workspace = "ctrl+alt+k"
switch_workspace = "ctrl+alt+1..9"
next_agent = "ctrl+alt+l"
previous_agent = "ctrl+alt+h"
next_tab = ["prefix+n", "ctrl+alt+n"]
previous_tab = ["prefix+p", "ctrl+alt+p"]
open_notification_target = ["prefix+o", "ctrl+alt+o"]
goto = ["prefix+g", "ctrl+alt+g"]

[[keys.command]]
key = "ctrl+alt+slash"
type = "popup"
command = "less -R ~/Git/toolbox/dot/herdr/.config/herdr/cheatsheet.txt"
width = "80%"
height = "90%"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "agent"],
  ["tab"],
]

[update]
version_check = false
manifest_check = false
