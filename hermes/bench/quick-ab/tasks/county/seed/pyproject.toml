[project]
name = "cc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["click>=8.0"]

[project.scripts]
cc = "cc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
