# librarian. Keeps ~/Git/notes/wiki, an LLM wiki under human review: the
# bundled llm-wiki skill does the synthesis, llm-wiki-review stops it at a
# Review/ proposal, and hooks/wiki-review-gate.py refuses any compiled-page
# write that Greg has not approved. The skill alone is advice to a small model;
# the hook is what makes the review real.
model:
  provider: "custom"
  default: Qwen3.6-35B-A3B-4bit-DWQ
  base_url: http://127.0.0.1:8000/v1
  api_key: ${OMLX_API_KEY}
  request_timeout_seconds: 1800

# Relative paths in write_file/patch resolve here, and the gate assumes so.
terminal:
  cwd: "${HOME}/Git/notes/wiki"

hooks_auto_accept: true
hooks:
  pre_tool_call:
    - matcher: "^(write_file|patch)$"
      command: "${HOME}/.hermes/hooks/wiki-review-gate.py"
      timeout: 30
      fail_closed: true

agent:
  # THE WHOLE LIST, not just homeassistant. A profile's `disabled_toolsets`
  # REPLACES the root config's rather than merging with it, so carrying only
  # `homeassistant` here re-advertised the sixteen the root turns off: every
  # profile paid 25 tools / 42.2 KB of schema per request against `default`'s
  # 16 / 30.0 KB. `hermes -p <bot> prompt-size` against `hermes -p default
  # prompt-size` is how you see it; the root's own comment on this list explains
  # why the size matters to a 3B-active model.
  disabled_toolsets:
    - web
    - search
    - x_search
    - browser
    - image_gen
    - video_gen
    - computer_use
    - discord
    - feishu
    - spotify
    - connectors
    - a2a
    - react
    - tts
    - cronjob
    - session_search
    - todo
    # The homeassistant toolset registers regardless of HASS_URL/HASS_TOKEN, so
    # with neither set `ha_list_entities` resolved the default
    # homeassistant.local:8123, failed DNS, and sent the bot off self-debugging:
    # one Telegram question produced ten tool errors, four of them `terminal`.
    # dungeon's Hermes leaves this toolset off deliberately
    # (home-lab/hermes/README.md §8) because HA has no per-entity permissions
    # and the locks are S2 Authenticated. moria has no HA access at all, so it
    # has no business offering the tools.
    - homeassistant
    # @mentions do NOT need Task Delegation — that tool spawns anonymous
    # temporary subagents, while messaging a persistent teammate is native Bot
    # Mode. Leaving it on cost 4,650 B of schema on every request, the third
    # largest block after `file` and `skills`, and offered a second writer.
    - delegation
