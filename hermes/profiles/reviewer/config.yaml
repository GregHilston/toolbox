# reviewer. A Bot is a profile, so this file is what the Desktop roster edits.
#
# Reviews what the builder wrote, with its own SOUL so the review style can be
# tuned without touching the orchestrator's planning. A different family from
# the builder: on 2026-09-25 the Qwen MoE declared done with hidden tests
# failing in 6 of 9 runs, and a DeepSeek review round fixed most of them
# (notes: ref-hermes-run-log.md). Kanban's own review lane does not use this
# bot; it reruns the builder with `sdlc-review`.
model:
  provider: ${MODEL_PROVIDER}
  default: ${MODEL_NAME}
  base_url: ${MODEL_BASE_URL}
  api_key: ${MODEL_API_KEY}
  request_timeout_seconds: 1800

# No hooks block: this bot never completes a card. Its gate is the
# `verify-agent-output` skill, which it runs itself.

# The SAME directory the builder starts in. A reviewer that cannot read the
# work is not a reviewer, and the Bot Mode walkthrough names this as the thing
# to test with a harmless file before trusting a run.
terminal:
  cwd: "${HOME}/Git/agent-runs/workspace"

agent:
  # Narrow on purpose. The Bot Mode walkthrough's recommended orchestrator keeps
  # File Operations, Skills, Clarifying Questions and Memory, plus Terminal for
  # "bounded checks" — which for a coding reviewer is the whole job: run the
  # gate, diff the tree, profile the output. Independent web research is off for
  # an orchestrator; so is everything that would let it do the builder's work.
  #
  # `delegation` is off for a reason that is easy to get wrong: @mentions do NOT
  # need it. Task Delegation spawns anonymous temporary subagents; messaging a
  # persistent teammate is native Bot Mode. Leaving it on offers this bot a way
  # to start a second writer, which is the one thing the architecture forbids.
  disabled_toolsets:
    - web
    - search
    - x_search
    - browser
    - browser-use
    - image_gen
    - video_gen
    - computer_use
    - discord
    - feishu
    - spotify
    - connectors
    - connections
    - a2a
    - react
    - tts
    - cronjob
    - session_search
    - todo
    - homeassistant
    - delegation
    - code_execution
    - vision
    - desktop_ui
    - project
