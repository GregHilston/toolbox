agent:
  reasoning_effort: "low"
  # Measured with `hermes -p builder prompt-size`: this list takes tool schemas
  # from 40,394 B to 20,277 B, ~5k tokens off every single request on a workload
  # where half the GPU time was prefill. `delegation` matters most — it is the
  # second agent loop home-lab/hermes records a 3B-active model cannot drive.
  disabled_toolsets:
    - delegation
    - browser
    - browser-use
    - code_execution
    - web
    - search
    - x_search
    - tts
    - vision
    - image_gen
    - video_gen
    - computer_use
    - discord
    - feishu
    - spotify
    - connectors
    - a2a
    - react
    - cronjob
    - session_search
    - todo
