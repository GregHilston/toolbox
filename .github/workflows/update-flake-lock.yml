name: Update flake.lock

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {} # allow manual runs

jobs:
  update-lock:
    name: Update nixos/flake.lock
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr-number: ${{ steps.update.outputs.pull-request-number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Update flake.lock and open PR
        id: update
        uses: DeterminateSystems/update-flake-lock@main
        with:
          path-to-flake-dir: nixos
          pr-title: "chore(flake): update flake.lock"
          pr-labels: |
            dependencies
            automated

  # The PR this workflow opens is created with the default GITHUB_TOKEN, and GitHub
  # deliberately does not start workflow runs for events raised by that token (it is
  # how they stop bots recursing). So `validate.yml`/`fmt.yml`, which trigger on
  # `pull_request`, never run on it — PR #72 sat open for a month with *zero* checks
  # and nobody could tell whether the lock it proposed even evaluated.
  #
  # There is no fix on the PR side short of a PAT. Instead validate the branch here,
  # from the scheduled run, which does have a normal workflow context — then say so on
  # the PR so the result is visible where the human is actually looking.
  validate:
    name: Validate the proposed lock
    needs: update-lock
    # Skip when the lock was already current: no PR, nothing to check.
    if: needs.update-lock.outputs.pr-number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the bot's branch
        uses: actions/checkout@v7
        with:
          ref: update_flake_lock_action

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v8

      # `just validate` (nixos/justfile) rather than a copy of it here: it runs
      # `nix flake check` and then evaluates every host to a toplevel drvPath,
      # deriving the host list from the flake so a new host needs no edit in either
      # place. Instantiating a derivation needs no builder for its platform, which is
      # what lets this one Linux runner cover the aarch64-darwin hosts too.
      #
      # `.#ci`, not the default dev shell: everything entered here gets built from
      # the very lock under test, and the default shell would drag nh, nvd,
      # nix-output-monitor and treefmt in with it. See flake-modules/dev.nix.
      #
      # Evaluation is minutes, not tens of minutes, so bound it — but on the STEP,
      # not the job. A job timeout *cancels*, which is the one thing the
      # `!cancelled()` guard on the report step below suppresses: the timeout added
      # to make a runaway visible would leave the PR with no comment at all. A step
      # timeout is a step failure, so the report still runs and still says ❌. This
      # is the job's only long-running step, so the bound is the same either way.
      - name: Check the flake and evaluate every host
        working-directory: nixos
        timeout-minutes: 30
        run: nix develop .#ci --command just validate

      # Report unless the run was cancelled — `always()` would fire on cancellation
      # too, and `job.status` is `cancelled` there, which would post a hard
      # "do not merge" verdict about a lock nothing ever checked.
      #
      # A red run buried in the Actions tab is not a signal anyone sees; a comment on
      # the PR is. GH_REPO because a failure in the checkout step above leaves an empty
      # workspace, and `gh` would otherwise have no git remote to infer the repo from —
      # failing silently in exactly the case this step exists to report.
      - name: Report the result on the PR
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.update-lock.outputs.pr-number }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = "success" ]; then
            body="✅ **Lock validated** — \`nix flake check\` passed and every host evaluates to a toplevel derivation. ([run]($RUN_URL))

          Evaluation is not a build. It cannot catch a fixed-output hash mismatch in a
          dependency, so real-build the host you are about to deploy (\`nix build
          .#darwinConfigurations.<host>.system\`) before \`just dr\`/\`just fr\`."
          else
            body="❌ **Lock failed validation** — do not merge. ([run]($RUN_URL))"
          fi
          gh pr comment "$PR" --body "$body"
