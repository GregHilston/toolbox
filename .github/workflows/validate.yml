name: Validate Nix Configurations

on:
  push:
    branches: [master, main]
    paths:
      - "nixos/**"
  pull_request:
    paths:
      - "nixos/**"

jobs:
  validate:
    name: Validate NixOS configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Run flake check
        working-directory: nixos
        run: nix flake check

      - name: Validate every nixos host
        working-directory: nixos
        run: |
          hosts=$(nix eval .#nixosConfigurations --raw --apply 'x: toString (builtins.attrNames x)')
          test -n "$hosts"
          for h in $hosts; do
            echo "Building $h..."
            nix build ".#nixosConfigurations.$h.config.system.build.toplevel" --dry-run
          done

  validate-darwin:
    name: Validate Darwin configurations
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Validate every darwin host
        working-directory: nixos
        run: |
          hosts=$(nix eval .#darwinConfigurations --raw --apply 'x: toString (builtins.attrNames x)')
          test -n "$hosts"
          for h in $hosts; do
            echo "Building $h..."
            nix build ".#darwinConfigurations.$h.system" --dry-run
          done
