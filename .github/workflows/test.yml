name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pi extensions and bin/ scripts
    # These scripts run on Macs.
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run tests
        run: |
          brew install just
          just test

      - name: Pushover on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --fail-with-body https://api.pushover.net/1/messages.json \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=toolbox Tests failed on ${GITHUB_REF_NAME}" \
            --form-string "message=${GITHUB_SHA::7}: $(git log -1 --format=%s)" \
            --form-string "url=$RUN_URL"
