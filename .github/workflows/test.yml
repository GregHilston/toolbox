name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Pi extensions and bin/ scripts
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Run tests
        run: |
          brew install just
          just test
